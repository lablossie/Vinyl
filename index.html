<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#161210">
<title>Platenkast</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- PIN login screen -->
  <div id="auth-screen" class="auth-screen">
    <div class="auth-card">
      <div class="eyebrow">Platencollectie</div>
      <h1 class="serif auth-title">Platenkast</h1>
      <p class="auth-sub">Voer de pincode in om je collectie te zien.</p>
      <form id="auth-form" autocomplete="off">
        <input id="pin-input" class="pin-input" type="password" inputmode="numeric" maxlength="12" placeholder="&bull;&bull;&bull;&bull;" autofocus>
        <button type="submit" id="auth-submit" class="btn-primary">Ontgrendelen</button>
      </form>
      <div id="auth-error" class="auth-error" hidden>Onjuiste pincode, probeer opnieuw.</div>
    </div>
  </div>

  <!-- Main app shell -->
  <div id="app" class="app-shell" hidden>
    <main id="view" class="view"></main>

    <nav class="tabbar">
      <button class="tab-icon" data-nav="artiesten" aria-label="Artiesten">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9v-5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v5h2.5a1 1 0 0 0 1-1v-9"/></svg>
      </button>
      <div class="tab-group">
        <button class="tab-pill" data-nav="artiesten">Artiesten</button>
        <button class="tab-pill" data-nav="alle">Alle platen</button>
        <button class="tab-pill" data-nav="wenslijst">Wenslijst</button>
      </div>
      <button class="tab-add" data-nav="toevoegen" aria-label="Plaat toevoegen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="js/utils.js"></script>
  <script src="js/data/seedRecords.js"></script>
  <script src="js/state.js"></script>
  <script src="js/photoRecognize.js"></script>
  <script src="js/render/modal.js"></script>
  <script src="js/render/instellingen.js"></script>
  <script src="js/render/artiestenLijst.js"></script>
  <script src="js/render/artiestDetail.js"></script>
  <script src="js/render/albumDetail.js"></script>
  <script src="js/render/alleRecords.js"></script>
  <script src="js/render/wenslijst.js"></script>
  <script src="js/render/toevoegen.js"></script>
  <script src="js/router.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
